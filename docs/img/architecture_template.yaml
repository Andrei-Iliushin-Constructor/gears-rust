# "PREFIX - " unit tag, drops parenthetical notes, lowercases and removes
# non-alphanumerics) and matches it against the same normalization of each SVG
# gear label. The overrides below cover SVG labels whose text differs from the
# GitHub title beyond what normalization handles (typos, abbreviations,
# renames). Keys are the exact SVG label text; values are the exact GitHub
# issue titles.
# ---------------------------------------------------------------------------
